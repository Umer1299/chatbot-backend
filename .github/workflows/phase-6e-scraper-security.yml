name: Phase 6E scraper security regressions

on:
  pull_request:
    branches: [security/phase-6d-batch3-http-parsing-patches]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.head_ref == 'security/phase-6e-scraper-ssrf-credential-isolation' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'security/phase-6e-scraper-ssrf-credential-isolation')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: chatflow_security_test
          POSTGRES_USER: chatflow_test
          POSTGRES_PASSWORD: local_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chatflow_test -d chatflow_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://chatflow_test:local_test_only@127.0.0.1:5432/chatflow_security_test
      TEST_DATABASE_CONFIRM: I_CONFIRM_DISPOSABLE_TEST_DATABASE
      STAGING_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Verify exact stacked baseline and toolchain
        run: |
          test "$(git rev-parse HEAD^)" = 'e0f6ee3a20f2148c335c69cd3919cda9bf601c0b'
          test "$(node --version)" = 'v24.21.0'
          test "$(npm --version)" = '11.19.0'
          git diff --check HEAD^ HEAD
      - run: npm ci --ignore-scripts
      - name: Targeted no-network security regressions
        run: node --experimental-test-module-mocks --test test/scrapeDestinationPolicy.test.js test/firecrawlCredentialIsolation.test.js test/security.test.js
      - name: Full backend suite with isolated PostgreSQL and Redis
        run: npm test
      - name: Verify pinned dependency lockfile unchanged by installation
        run: git diff --exit-code -- package.json package-lock.json
