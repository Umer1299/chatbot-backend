name: Phase 6D Batch 3 HTTP patch evidence

on:
  pull_request:
    branches: [security/phase-6d-batch2-multer-hardening]
    paths:
      - '.github/workflows/phase-6d-batch3-http-patches.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'test/batch3DependencySecurity.test.js'
      - 'docs/phase-6d-batch3-http-patches.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'security/phase-6d-batch3-http-parsing-patches' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'security/phase-6d-batch3-http-parsing-patches')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Verify stacked baseline and scoped changes
        shell: bash
        run: |
          set -euo pipefail
          baseline=91805ca382aa15f434afec588f73bc092d94a638
          git merge-base --is-ancestor "$baseline" HEAD
          test "$(git rev-parse "$baseline":package-lock.json)" = '40bff5762a0ddec2f96cc5e38d46332e83c9d0b9'
          git diff --check "$baseline" HEAD
          git diff --name-only "$baseline" HEAD | while read -r file; do
            case "$file" in
              .github/workflows/phase-6d-batch3-http-patches.yml|package.json|package-lock.json|test/batch3DependencySecurity.test.js|docs/phase-6d-batch3-http-patches.md) ;;
              *) echo 'Unexpected change in Batch 3 scope'; exit 1 ;;
            esac
          done
          node --version
          npm --version
          test "$(node --version)" = 'v24.21.0'
          test "$(npm --version)" = '11.19.0'
      - name: Test audit sanitizer
        run: node --test .github/scripts/audit-evidence.test.mjs
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Generate and validate four reports
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p raw
          npm audit --json > raw/audit-full.json 2>/dev/null; full=$?
          npm audit --omit=dev --json > raw/audit-production.json 2>/dev/null; production=$?
          npm ls --all --json > raw/dependency-tree.json 2>/dev/null; tree=$?
          npm outdated --json > raw/outdated.json 2>/dev/null; outdated=$?
          printf '{"auditFull":%d,"auditProduction":%d,"dependencyTree":%d,"outdated":%d}\n' "$full" "$production" "$tree" "$outdated" > raw/exit-status.json
          set -e
          node .github/scripts/audit-evidence.mjs
          git diff --exit-code -- package.json package-lock.json
      - name: Verify targeted resolutions and critical findings
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const pinned = {
            'body-parser': '1.20.9', 'express-rate-limit': '8.6.0',
            'ip-address': '10.7.4', 'follow-redirects': '1.16.1',
            '@xmldom/xmldom': '0.8.15', 'form-data': '4.0.6',
            'multer': '2.5.0', 'proxy-addr': '2.0.8',
            'protobufjs': '7.6.6', '@grpc/grpc-js': '1.14.6',
          };
          for (const [name, version] of Object.entries(pinned)) {
            const copies = Object.entries(lock.packages).filter(([path]) =>
              path === 'node_modules/' + name || path.endsWith('/node_modules/' + name));
            assert.ok(copies.length, `missing ${name}`);
            for (const [path, entry] of copies) assert.equal(entry.version, version, path);
          }
          const tree = JSON.parse(fs.readFileSync('reports/dependency-tree.json'));
          const checkTree = node => {
            for (const [name, child] of Object.entries(node.dependencies || {})) {
              if (pinned[name]) assert.equal(child.version, pinned[name], `installed ${name}`);
              checkTree(child);
            }
          };
          checkTree(tree);
          for (const report of ['audit-full.json', 'audit-production.json']) {
            const audit = JSON.parse(fs.readFileSync('reports/' + report));
            assert.equal(audit.metadata.vulnerabilities.critical, 0);
            for (const name of ['body-parser','express-rate-limit','ip-address','follow-redirects','@xmldom/xmldom','form-data','multer','proxy-addr','protobufjs'])
              assert.equal(audit.vulnerabilities[name], undefined, `${report}: ${name}`);
            console.log(report, audit.metadata.vulnerabilities);
          }
          NODE
      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-6d-batch-3-http-patch-evidence
          path: reports/*.json
          if-no-files-found: error
          retention-days: 1
