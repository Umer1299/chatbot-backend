# REVIEW-ONLY blueprint. BLOCKED: Render internal PostgreSQL cannot provide
# verified CA+hostname TLS according to provider docs. Do not sync this file.
# Separate names avoid changing any existing staging web service.
services:
  - type: pserv
    name: chatflow-preflight-private-api
    runtime: node
    plan: starter
    region: virginia
    branch: security/phase-7a-isolated-staging-security-preflight
    autoDeployTrigger: off
    buildCommand: npm ci --ignore-scripts && node scripts/verify-infra-staging-source.js
    startCommand: node scripts/start-infra-staging.js
    healthCheckPath: /readyz
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: CHATFLOW_ENVIRONMENT
        value: isolated-staging
      - key: STAGING_REHEARSAL_MODE
        value: infra-only
      - key: STAGING_APPROVED_COMMIT_SHA
        sync: false
      - key: AGENT_WEBSITE_ENABLED
        value: "false"
      - key: STAGING_DISABLE_LEGACY_FILE_UPLOADS
        value: "true"
      - key: STAGING_DISABLE_SCRAPING
        value: "true"
      - key: STAGING_DISABLE_PROVIDERS
        value: "true"
      - key: ACCOUNT_AUTH_ENABLED
        value: "false"
      - key: ACCOUNT_PROXY_MODE
        value: direct
      - key: STAGING_MAX_CONNECTIONS
        sync: false
      - key: STAGING_ALLOWED_HOST
        sync: false # Exact private service Host including port; verify provider probe behavior.
      - key: STAGING_REDIS_HOST
        sync: false # Exact internal hostname of new authenticated staging Key Value.
      - key: STAGING_MAX_ACTIVE_REQUESTS
        sync: false
      - key: STAGING_REQUEST_TIMEOUT_MS
        sync: false
      - key: DATABASE_URL
        sync: false # Dedicated read-only API role, never the database owner URL.
      - key: STAGING_DATABASE_URL
        sync: false # Must exactly match DATABASE_URL; supplied only after owner review.
      - key: STAGING_DATABASE_CA_PEM
        sync: false
      - key: REDIS_URL
        sync: false # Authenticated URL only, after enabling internal authentication.
      - key: STAGING_REDIS_URL
        sync: false # Must match REDIS_URL exactly.

# No worker or datastore is declared. A future separately approved procedure
# must create Key Value with internal authentication enabled and select a
# PostgreSQL topology with CA+hostname-verifiable TLS before any sync.
